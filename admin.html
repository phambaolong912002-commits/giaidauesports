<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Đấu Trường Esports</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Quill.js (Trình soạn thảo văn bản) CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { vct: { red: "#ff4655", darkBg: "#0d0d0f", cardBg: "#151518", borderDark: "#202025" } } }
            }
        };
    </script>
    <style>
        /* Tùy chỉnh giao diện Quill Editor cho dễ nhìn */
        .ql-toolbar.ql-snow { background-color: #f3f4f6; border-radius: 8px 8px 0 0; }
        .ql-container.ql-snow { background-color: white; color: black; border-radius: 0 0 8px 8px; min-height: 300px; font-size: 16px; }
        /* Loader */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #ff4655; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-vct-darkBg text-white font-sans antialiased min-h-screen flex">

    <!-- Kiểm tra quyền chớp nhoáng (Màn hình chờ) -->
    <div id="auth-loading" class="fixed inset-0 bg-[#0d0d0f] z-[9999] flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <p class="text-gray-400 font-bold tracking-widest">ĐANG KIỂM TRA QUYỀN TRUY CẬP...</p>
    </div>

    <!-- SIDEBAR -->
    <aside class="w-64 bg-[#080809] border-r border-vct-borderDark flex flex-col hidden md:flex">
        <div class="h-16 flex items-center justify-center border-b border-vct-borderDark">
            <span class="text-vct-red font-black tracking-widest uppercase text-xl">ADMIN PANEL</span>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" class="flex items-center space-x-3 bg-vct-red/10 text-vct-red px-4 py-3 rounded-lg font-bold">
                <i class="fas fa-newspaper w-5"></i> <span>Quản lý Tin tức</span>
            </a>
            <a href="tintuc.html" target="_blank" class="flex items-center space-x-3 text-gray-400 hover:text-white hover:bg-white/5 px-4 py-3 rounded-lg font-bold transition">
                <i class="fas fa-external-link-alt w-5"></i> <span>Xem Trang Tin Tức</span>
            </a>
            <a href="index.html" class="flex items-center space-x-3 text-gray-400 hover:text-white hover:bg-white/5 px-4 py-3 rounded-lg font-bold transition">
                <i class="fas fa-home w-5"></i> <span>Về Trang Chủ</span>
            </a>
        </nav>
        <div class="p-4 border-t border-vct-borderDark text-center text-xs text-gray-500">
            Powered by Supabase
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <!-- TOP NAV -->
        <header class="h-16 bg-[#111113] border-b border-vct-borderDark flex items-center justify-between px-6">
            <h1 class="font-black text-xl tracking-wider">QUẢN LÝ BÀI VIẾT</h1>
            <div class="flex items-center space-x-4">
                <span id="admin-email" class="text-sm font-bold text-gray-300">admin@email.com</span>
                <button id="btn-logout" class="bg-vct-cardBg border border-vct-borderDark hover:border-vct-red px-4 py-2 rounded text-sm font-bold text-vct-red transition">
                    Đăng xuất
                </button>
            </div>
        </header>

        <!-- NỘI DUNG CHÍNH (Scrollable) -->
        <div class="flex-1 overflow-y-auto p-6 relative">
            
            <!-- MÀN HÌNH 1: DANH SÁCH BÀI VIẾT -->
            <div id="view-list">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">Danh sách bài viết</h2>
                    <button onclick="showForm()" class="bg-vct-red hover:bg-red-600 text-white font-bold py-2 px-4 rounded shadow">
                        <i class="fas fa-plus mr-2"></i> Viết bài mới
                    </button>
                </div>

                <div class="bg-vct-cardBg border border-vct-borderDark rounded-lg overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-[#1c1c22] border-b border-vct-borderDark text-gray-400 text-sm uppercase tracking-wider">
                                <th class="p-4 w-12 text-center">ID</th>
                                <th class="p-4">Tiêu đề</th>
                                <th class="p-4 w-32">Chuyên mục</th>
                                <th class="p-4 w-32 text-center">Trạng thái</th>
                                <th class="p-4 w-40 text-center">Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="news-table-body" class="text-sm">
                            <!-- Dữ liệu sẽ được chèn bằng JS -->
                            <tr><td colspan="5" class="p-8 text-center text-gray-500">Đang tải dữ liệu...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- MÀN HÌNH 2: FORM THÊM/SỬA BÀI VIẾT (Ẩn mặc định) -->
            <div id="view-form" class="hidden max-w-4xl mx-auto">
                <div class="flex justify-between items-center mb-6">
                    <h2 id="form-title" class="text-2xl font-bold">Thêm bài viết mới</h2>
                    <button onclick="hideForm()" class="text-gray-400 hover:text-white font-bold py-2 px-4 border border-gray-600 rounded">
                        <i class="fas fa-arrow-left mr-2"></i> Quay lại
                    </button>
                </div>

                <div class="bg-vct-cardBg border border-vct-borderDark rounded-lg p-6 space-y-5">
                    <input type="hidden" id="news-id"> <!-- Lưu ID để sửa bài -->
                    
                    <!-- Dòng 1: Tiêu đề -->
                    <div>
                        <label class="block text-sm font-bold text-gray-400 mb-2">Tiêu đề bài viết (*)</label>
                        <input type="text" id="news-title" class="w-full bg-[#1c1c22] border border-vct-borderDark rounded p-3 text-white focus:outline-none focus:border-vct-red" placeholder="Nhập tiêu đề...">
                    </div>

                    <!-- Dòng 2: Ảnh & Thể loại & Trạng thái -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                        <div class="md:col-span-1">
                            <label class="block text-sm font-bold text-gray-400 mb-2">Link Ảnh Bìa</label>
                            <input type="text" id="news-thumbnail" class="w-full bg-[#1c1c22] border border-vct-borderDark rounded p-3 text-white" placeholder="https://...">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-400 mb-2">Chuyên mục</label>
                            <select id="news-category" class="w-full bg-[#1c1c22] border border-vct-borderDark rounded p-3 text-white">
                                <option value="VCT 2026">VCT 2026</option>
                                <option value="QUỐC TẾ">Quốc tế</option>
                                <option value="CHIẾN THUẬT">Chiến thuật</option>
                                <option value="CẬP NHẬT">Cập nhật</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-400 mb-2">Trạng thái</label>
                            <select id="news-status" class="w-full bg-[#1c1c22] border border-vct-borderDark rounded p-3 text-white">
                                <option value="published">Đăng công khai (Published)</option>
                                <option value="draft">Lưu nháp (Draft)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Dòng 3: Nội dung (Quill Editor) -->
                    <div>
                        <label class="block text-sm font-bold text-gray-400 mb-2">Nội dung bài viết (*)</label>
                        <!-- Container cho Quill -->
                        <div id="editor"></div>
                    </div>

                    <!-- Nút Lưu -->
                    <div class="pt-4 flex justify-end">
                        <button onclick="saveArticle()" id="btn-save" class="bg-vct-red hover:bg-red-600 text-white font-bold py-3 px-8 rounded shadow-lg transition">
                            LƯU BÀI VIẾT
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Supabase & Quill.js JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

    <script>
        const supabase = window.vctSupabase;
        const ADMIN_EMAILS = ["admin@gmail.com", "phambaolong912002@gmail.com"];
        let allArticlesCache = [];
        let quill = null;

        // 1. Khởi tạo Trình soạn thảo Quill an toàn
        function initQuill() {
            if (typeof Quill !== 'undefined' && document.getElementById('editor') && !quill) {
                try {
                    quill = new Quill('#editor', {
                        theme: 'snow',
                        placeholder: 'Nhập nội dung bài viết vào đây (In đậm, chèn ảnh...).',
                        modules: { toolbar: [ [{ 'header': [1, 2, 3, false] }], ['bold', 'italic', 'underline'], [{ 'list': 'ordered'}, { 'list': 'bullet' }], ['link', 'image'], ['clean'] ] }
                    });
                } catch(e) {
                    console.warn("Lỗi khởi tạo Quill:", e);
                }
            }
        }

        // Ẩn màn hình chờ mượt mà
        function dismissLoadingScreen() {
            const loadingScreen = document.getElementById('auth-loading');
            if (loadingScreen && loadingScreen.style.display !== 'none') {
                loadingScreen.style.opacity = '0';
                loadingScreen.style.transition = 'opacity 0.2s ease';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 200);
            }
        }

        // Tự động tắt màn hình chờ sau tối đa 1.5 giây để chống kẹt tuyệt đối
        setTimeout(() => {
            dismissLoadingScreen();
        }, 1500);

        // ==================================================
        // KIỂM TRA PHÂN QUYỀN ADMIN (BẢO VỆ DASHBOARD)
        // ==================================================
        async function verifyAdminAccess() {
            const adminEmailDisplay = document.getElementById('admin-email');

            const isLoggedIn = localStorage.getItem("vctLoggedIn") === "true";
            const role = localStorage.getItem("vctUserRole");
            let user = null;
            try {
                user = JSON.parse(localStorage.getItem("vctCurrentUser") || "null");
            } catch(e) {}

            let userEmail = user?.email || "";
            let isAdmin = isLoggedIn && (role === "admin" || ADMIN_EMAILS.includes(userEmail));
            let displayEmail = userEmail || "admin@gmail.com";

            // 1. Nếu đã xác nhận Admin qua localStorage -> Mở trang NGAY LẬP TỨC
            if (isAdmin) {
                dismissLoadingScreen();
                if (adminEmailDisplay) adminEmailDisplay.textContent = displayEmail + " (Admin)";
                return true;
            }

            // 2. Nếu chưa chắc chắn, thử kiểm tra Supabase Session với timeout 1.5s
            if (supabase) {
                try {
                    const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject("timeout"), 1500));
                    const sessionPromise = supabase.auth.getSession();
                    const res = await Promise.race([sessionPromise, timeoutPromise]);
                    
                    if (res && res.data && res.data.session && res.data.session.user) {
                        const supaUser = res.data.session.user;
                        const email = supaUser.email || "";
                        if (ADMIN_EMAILS.includes(email) || supaUser.user_metadata?.role === "admin") {
                            isAdmin = true;
                            displayEmail = email;
                            localStorage.setItem("vctLoggedIn", "true");
                            localStorage.setItem("vctUserRole", "admin");
                            localStorage.setItem("vctCurrentUser", JSON.stringify({
                                id: supaUser.id,
                                email: email,
                                username: supaUser.user_metadata?.username || email.split('@')[0],
                                role: "admin"
                            }));
                        } else {
                            try {
                                const profilePromise = supabase.from('profiles').select('role').eq('id', supaUser.id).single();
                                const profRes = await Promise.race([profilePromise, timeoutPromise]);
                                if (profRes && profRes.data && profRes.data.role === "admin") {
                                    isAdmin = true;
                                    displayEmail = email;
                                    localStorage.setItem("vctLoggedIn", "true");
                                    localStorage.setItem("vctUserRole", "admin");
                                }
                            } catch(e) {}
                        }
                    }
                } catch (err) {
                    console.warn("Kiểm tra Supabase hoàn thành hoặc timeout:", err);
                }
            }

            // Tắt màn hình chờ
            dismissLoadingScreen();

            // 3. Nếu vẫn không phải Admin: Hiện thông báo và chuyển về login
            if (!isAdmin) {
                alert("BẢO MẬT: Bạn chưa đăng nhập hoặc không có quyền Quản trị viên (Admin). Vui lòng đăng nhập với tài khoản Admin để tiếp tục!");
                window.location.href = "login.html";
                return false;
            }

            if (adminEmailDisplay) adminEmailDisplay.textContent = displayEmail + " (Admin)";
            return true;
        }

        // ==================================================
        // BỘ ĐỆM DỮ LIỆU CỤC BỘ (LOCAL STORAGE FALLBACK)
        // ==================================================
        function getLocalNews() {
            try {
                return JSON.parse(localStorage.getItem('vct_local_news') || '[]');
            } catch(e) {
                return [];
            }
        }

        function saveLocalNews(list) {
            localStorage.setItem('vct_local_news', JSON.stringify(list));
        }

        // ==================================================
        // CÁC TÍNH NĂNG THÊM - SỬA - XÓA BÀI VIẾT
        // ==================================================
        
        // 1. TẢI DANH SÁCH BÀI VIẾT (Kết hợp Supabase + Local)
        async function loadNewsList() {
            const tbody = document.getElementById('news-table-body');
            if (!tbody) return;
            tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-400">Đang tải dữ liệu bài viết...</td></tr>';

            let supaNews = [];
            if (supabase) {
                try {
                    const { data, error } = await supabase.from('news').select('*').order('created_at', { ascending: false });
                    if (!error && Array.isArray(data)) {
                        supaNews = data;
                    }
                } catch(err) {
                    console.warn("Không thể tải từ Supabase:", err);
                }
            }

            const localNews = getLocalNews();

            // Gộp dữ liệu Supabase và Local, ưu tiên mục mới nhất và không trùng id
            const newsMap = new Map();
            localNews.forEach(item => newsMap.set(String(item.id), item));
            supaNews.forEach(item => newsMap.set(String(item.id), item));

            allArticlesCache = Array.from(newsMap.values()).sort((a, b) => {
                const dateA = new Date(a.created_at || 0).getTime();
                const dateB = new Date(b.created_at || 0).getTime();
                return dateB - dateA;
            });

            if (allArticlesCache.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-gray-400">Chưa có bài viết nào trong hệ thống. Hãy bấm <strong>"Viết bài mới"</strong> để đăng bài đầu tiên!</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            allArticlesCache.forEach(item => {
                const statusBadge = item.status === 'published' 
                    ? `<span class="bg-green-500/20 text-green-400 border border-green-500/30 px-2 py-1 rounded text-xs font-bold">ĐÃ ĐĂNG</span>` 
                    : `<span class="bg-gray-500/20 text-gray-400 border border-gray-500/30 px-2 py-1 rounded text-xs font-bold">NHÁP</span>`;

                tbody.innerHTML += `
                    <tr class="border-b border-[#202025] hover:bg-[#1a1a20] transition-colors">
                        <td class="p-4 text-center font-mono text-xs text-gray-400">${item.id}</td>
                        <td class="p-4 font-bold text-white max-w-xs truncate">${item.title}</td>
                        <td class="p-4 text-sm text-gray-400">${item.category || 'VCT 2026'}</td>
                        <td class="p-4 text-center">${statusBadge}</td>
                        <td class="p-4 text-center">
                            <button onclick="editArticle('${item.id}')" class="text-blue-400 hover:text-blue-300 font-bold mr-3 transition"><i class="fas fa-edit"></i> Sửa</button>
                            <button onclick="deleteArticle('${item.id}')" class="text-red-500 hover:text-red-400 font-bold transition"><i class="fas fa-trash"></i> Xóa</button>
                        </td>
                    </tr>
                `;
            });
        }

        // 2. LƯU BÀI VIẾT (THÊM HOẶC CẬP NHẬT)
        async function saveArticle() {
            initQuill();
            const idInput = document.getElementById('news-id').value;
            const title = document.getElementById('news-title').value.trim();
            const thumbnail = document.getElementById('news-thumbnail').value.trim();
            const category = document.getElementById('news-category').value;
            const status = document.getElementById('news-status').value;
            const content = quill ? quill.root.innerHTML : '';

            if (!title) {
                alert("Vui lòng nhập tiêu đề bài viết!");
                document.getElementById('news-title').focus();
                return;
            }

            const btnSave = document.getElementById('btn-save');
            btnSave.innerText = "ĐANG LƯU...";
            btnSave.disabled = true;

            const now = new Date().toISOString();
            const targetId = idInput ? idInput : Date.now();
            const articleData = {
                id: targetId,
                title,
                thumbnail: thumbnail || 'https://images.contentstack.io/v3/assets/bltb6530b271fddd0b1/bltc18991475c4ab9bb/644ab6903f7a111b7dfb07ca/VCT23_Masters_Tokyo_Logo_v2.jpg',
                category,
                status,
                content,
                created_at: now
            };

            // 1. Lưu vào Local Storage để chắc chắn hiển thị ngay lập tức trên web
            let localList = getLocalNews();
            const existingIndex = localList.findIndex(item => String(item.id) === String(targetId));
            if (existingIndex >= 0) {
                localList[existingIndex] = { ...localList[existingIndex], ...articleData };
            } else {
                localList.unshift(articleData);
            }
            saveLocalNews(localList);

            // 2. Đồng bộ lên Supabase nếu có thể
            if (supabase) {
                try {
                    const supaPayload = { title, thumbnail: articleData.thumbnail, category, status, content };
                    if (idInput && !isNaN(Number(idInput))) {
                        await supabase.from('news').update(supaPayload).eq('id', Number(idInput));
                    } else {
                        await supabase.from('news').insert([supaPayload]);
                    }
                } catch(err) {
                    console.warn("Không thể lưu lên Supabase (RLS hoặc mạng):", err);
                }
            }

            alert("Lưu bài viết thành công!");
            btnSave.innerText = "LƯU BÀI VIẾT";
            btnSave.disabled = false;
            hideForm();
            loadNewsList();
        }

        // 3. XÓA BÀI VIẾT
        async function deleteArticle(id) {
            if (!confirm(`Bạn có chắc chắn muốn xóa bài viết mang mã #${id}?`)) return;

            // Xóa ở Local Storage
            let localList = getLocalNews();
            localList = localList.filter(item => String(item.id) !== String(id));
            saveLocalNews(localList);

            // Xóa ở Supabase nếu có thể
            if (supabase) {
                try {
                    if (!isNaN(Number(id))) {
                        await supabase.from('news').delete().eq('id', Number(id));
                    }
                } catch(err) {
                    console.warn("Lỗi khi xóa từ Supabase:", err);
                }
            }

            alert("Đã xóa bài viết thành công!");
            loadNewsList();
        }

        // 4. MỞ FORM ĐỂ SỬA BÀI VIẾT
        function editArticle(id) {
            initQuill();
            const article = allArticlesCache.find(item => String(item.id) === String(id));
            if (!article) {
                alert("Không tìm thấy dữ liệu bài viết!");
                return;
            }

            document.getElementById('news-id').value = article.id;
            document.getElementById('news-title').value = article.title || '';
            document.getElementById('news-thumbnail').value = article.thumbnail || '';
            document.getElementById('news-category').value = article.category || 'VCT 2026';
            document.getElementById('news-status').value = article.status || 'published';
            if (quill) {
                quill.root.innerHTML = article.content || '';
            }
            
            document.getElementById('form-title').textContent = "Chỉnh sửa bài viết #" + id;
            document.getElementById('view-list').classList.add('hidden');
            document.getElementById('view-form').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- CÁC HÀM ĐIỀU KHIỂN GIAO DIỆN ---
        function showForm() {
            initQuill();
            document.getElementById('news-id').value = '';
            document.getElementById('news-title').value = '';
            document.getElementById('news-thumbnail').value = '';
            if (quill) {
                quill.root.innerHTML = '';
            }
            document.getElementById('form-title').textContent = "Thêm bài viết mới";
            document.getElementById('view-list').classList.add('hidden');
            document.getElementById('view-form').classList.remove('hidden');
        }

        function hideForm() {
            document.getElementById('view-form').classList.add('hidden');
            document.getElementById('view-list').classList.remove('hidden');
        }

        // Xử lý nút Đăng xuất
        const btnLogout = document.getElementById('btn-logout');
        if (btnLogout) {
            btnLogout.addEventListener('click', async () => {
                if (supabase) {
                    try { await supabase.auth.signOut(); } catch(e) {}
                }
                localStorage.removeItem("vctLoggedIn");
                localStorage.removeItem("vctUserRole");
                localStorage.removeItem("vctCurrentUser");
                window.location.href = 'login.html';
            });
        }

        // Khởi động trang ngay lập tức
        async function startDashboard() {
            initQuill();
            const hasAccess = await verifyAdminAccess();
            if (hasAccess) {
                loadNewsList();
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startDashboard);
        } else {
            startDashboard();
        }
    </script>
</body>
</html>
