<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cài đặt - Đấu Trường Esports</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#0d0d0f] p-4 sm:p-6 text-white flex items-center justify-center">
  <main class="w-full max-w-xl rounded-2xl border border-white/10 bg-[#151518] p-5 sm:p-8 shadow-2xl">
    <a href="index.html" class="inline-flex items-center text-xs font-bold uppercase tracking-wider text-[#ff4655] hover:underline">
      ← Về trang chủ
    </a>
    <h1 class="mt-4 text-2xl sm:text-3xl font-black">Cài đặt</h1>
    <p class="mt-2 text-xs sm:text-sm text-gray-400">Quản lý phiên đăng nhập và tùy chọn tài khoản.</p>
    <div class="mt-6 pt-6 border-t border-white/10">
      <button id="logout" class="w-full sm:w-auto rounded-lg bg-[#ff4655] hover:bg-[#e03e4c] px-6 py-3 text-xs font-black uppercase tracking-wider transition">
        ĐĂNG XUẤT
      </button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    document.getElementById('logout').addEventListener('click', async () => {
      if (window.vctSupabase) {
        try { await window.vctSupabase.auth.signOut(); } catch(e) {}
      }
      localStorage.removeItem('vctLoggedIn');
      localStorage.removeItem('vctUserRole');
      localStorage.removeItem('vctCurrentUser');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
